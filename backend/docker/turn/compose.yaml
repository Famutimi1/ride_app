# Run on a Linux TURN host after preparing the protected config and TLS files.
# Linux host networking preserves the relay port mapping used by ICE.
services:
  turn:
    image: coturn/coturn:4.18.0-r0
    network_mode: host
    restart: unless-stopped
    read_only: true
    user: "${TURN_UID:-1000}:${TURN_GID:-1000}"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m,mode=1777]
    command: ["-c", "/run/turn/turnserver.conf"]
    volumes:
      - "${TURN_CONFIG_FILE:?Set TURN_CONFIG_FILE}:/run/turn/turnserver.conf:ro"
      - "${TURN_TLS_CERT_FILE:?Set TURN_TLS_CERT_FILE}:/run/turn/tls/fullchain.pem:ro"
      - "${TURN_TLS_KEY_FILE:?Set TURN_TLS_KEY_FILE}:/run/turn/tls/privkey.pem:ro"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
