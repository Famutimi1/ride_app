<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Map Grid / Road Background -->
  <g opacity="0.4">
    <path d="M50 80 Q150 120 220 70 T350 110" stroke="#CBD5E1" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M70 230 Q180 180 260 220 T360 170" stroke="#CBD5E1" stroke-width="28" stroke-linecap="round" fill="none"/>
    <path d="M120 50 Q160 150 140 250" stroke="#E2E8F0" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M280 50 Q260 160 300 250" stroke="#E2E8F0" stroke-width="20" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Glowing Route Path -->
  <path d="M80 200 C130 160 170 180 220 120 C250 84 280 90 320 85" stroke="#798572" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M80 200 C130 160 170 180 220 120 C250 84 280 90 320 85" stroke="#176B17" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round" fill="none"/>

  <!-- Start Point (Rider) -->
  <circle cx="80" cy="200" r="14" fill="#176B17" fill-opacity="0.2"/>
  <circle cx="80" cy="200" r="8" fill="#176B17"/>
  <circle cx="80" cy="200" r="4" fill="#FFFFFF"/>

  <!-- Destination Point (Flag / Pin) -->
  <g transform="translate(305, 50)">
    <path d="M15 0 C6.7 0 0 6.7 0 15 C0 26.2 15 40 15 40 C15 40 30 26.2 30 15 C30 6.7 23.3 0 15 0 Z" fill="#16A34A"/>
    <circle cx="15" cy="14" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Live Moving Driver / Car Card -->
  <g transform="translate(170, 95)" filter="drop-shadow(0px 8px 16px rgba(15, 23, 42, 0.15))">
    <rect width="90" height="50" rx="14" fill="#FFFFFF"/>
    <!-- Car icon -->
    <rect x="12" y="16" width="30" height="18" rx="5" fill="#176B17"/>
    <rect x="18" y="11" width="18" height="10" rx="3" fill="#176B45"/>
    <circle cx="19" cy="34" r="4" fill="#1E293B"/>
    <circle cx="35" cy="34" r="4" fill="#1E293B"/>
    <!-- Pulse badge -->
    <circle cx="68" cy="25" r="10" fill="#DCFCE7"/>
    <circle cx="68" cy="25" r="5" fill="#16A34A"/>
  </g>
</svg>
